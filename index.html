<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add two numbers</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f7;
        color: #1f2933;
        font: 16px/1.5 system-ui, sans-serif;
      }

      main {
        width: min(22rem, calc(100% - 2rem));
        padding: 2rem;
        border-radius: 0.75rem;
        background: #ffffff;
        box-shadow: 0 0.5rem 1.5rem rgb(31 41 51 / 12%);
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.25rem;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 1rem;
        padding: 0.5rem 0.6rem;
        border: 1px solid #9aa5b1;
        border-radius: 0.35rem;
        font: inherit;
      }

      input:focus {
        outline: 2px solid #2f80ed;
        outline-offset: 1px;
      }

      .result {
        margin: 0;
        padding-top: 1rem;
        border-top: 1px solid #e4e7eb;
        font-size: 1.125rem;
      }

      output {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Add two numbers</h1>
      <label for="first">First number</label>
      <input id="first" type="number" step="any" autocomplete="off" />
      <label for="second">Second number</label>
      <input id="second" type="number" step="any" autocomplete="off" />
      <p class="result">Sum: <output id="sum" for="first second">Enter two numbers to see their sum.</output></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
